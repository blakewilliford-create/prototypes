    <style>
      body {
        /* teal bloom anchored to the bottom of the viewport, faint cyan wash
           off to the right, and the original glow up top */
        background:
          radial-gradient(115% 55% at 50% 106%, rgba(4, 118, 126, 0.28) 0%, rgba(4, 118, 126, 0.08) 42%, rgba(4, 118, 126, 0) 72%),
          radial-gradient(70% 40% at 88% 102%, rgba(161, 242, 255, 0.09) 0%, rgba(161, 242, 255, 0) 70%),
          radial-gradient(circle at 50% -10%, rgba(161, 242, 255, 0.06) 0%, rgba(161, 242, 255, 0) 45%),
          var(--bg);
        background-attachment: fixed, fixed, fixed, fixed;
        overflow-y: auto;
        font-size: 14px;
      }

      /* ===== OVERLAY =====
         The product grid floats above the dashboard, which stays rendered
         underneath and is blurred by the overlay's backdrop-filter. */
      #overlay {
        position: fixed;
        inset: 0;
        z-index: 60;
        overflow-y: auto;
        /* same teal bloom on the overlay so it reads through the blur */
        background:
          radial-gradient(115% 55% at 50% 106%, rgba(4, 118, 126, 0.32) 0%, rgba(4, 118, 126, 0.09) 42%, rgba(4, 118, 126, 0) 72%),
          radial-gradient(70% 40% at 88% 102%, rgba(161, 242, 255, 0.10) 0%, rgba(161, 242, 255, 0) 70%),
          rgba(21, 26, 29, 0.5);
        -webkit-backdrop-filter: blur(30px);
        backdrop-filter: blur(30px);
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }

      body:not(.overlay-open) #overlay {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* lock the page behind the overlay */
      body.overlay-open { overflow: hidden; }

      body.overlay-open #overlay .wrap { animation: viewIn 0.35s ease both; }

      @keyframes viewIn {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: none; }
      }

      /* title + X, sharing the grid's container width */
      .overlay-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 26px;
      }

      .overlay-title {
        margin: 0;
        font-size: 20px;
        font-weight: 400;
        letter-spacing: 0.02em;
      }

      /* X — closes the overlay */
      .overlay-close {
        flex-shrink: 0;
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        padding: 0;
        background: rgba(255, 255, 255, 0.05);
        border: 0;
        border-radius: 999px;
        color: var(--fg-text);
        cursor: pointer;
        transition: background 0.2s;
      }
      .overlay-close:hover { background: rgba(255, 255, 255, 0.12); }
      .overlay-close:focus-visible { outline: 1px solid var(--glow); outline-offset: 2px; }

      /* reopens the overlay — sits in the container flow, hugging its left edge */
      .overlay-open-btn {
        align-self: flex-start;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: -6px;
        padding: 10px 20px;
        background: rgba(255, 255, 255, 0.05);
        -webkit-backdrop-filter: blur(50px);
        backdrop-filter: blur(50px);
        border: 0;
        border-radius: 999px;
        color: var(--fg-text);
        font-family: inherit;
        font-size: 13px;
        font-weight: 300;
        letter-spacing: 0.12em;
        cursor: pointer;
        transition: background 0.2s;
      }
      .overlay-open-btn:hover { background: rgba(255, 255, 255, 0.1); }
      .overlay-open-btn:focus-visible { outline: 1px solid var(--glow); outline-offset: 2px; }

      @media (prefers-reduced-motion: reduce) {
        #overlay, body.overlay-open #overlay .wrap { animation: none; transition: none; }
      }

      /* ===== GRID ===== */
      .wrap {
        max-width: 1140px;
        margin: 0 auto;
        padding: 44px 32px 96px;
      }

      .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(252px, 1fr));
        gap: 14px;
      }

      .product-card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 22px 22px 24px;
        background: var(--surface);
        border: 1px solid transparent;
        border-radius: 14px;
        color: var(--fg-text);
        text-decoration: none;
        overflow: hidden;
        transition: background 0.25s, border-color 0.25s, transform 0.25s;
      }

      /* soft top-left glow that fades in on hover */
      .product-card::before {
        content: '';
        position: absolute;
        top: -60px;
        left: -60px;
        width: 200px;
        height: 200px;
        background: radial-gradient(circle at center, rgba(161, 242, 255, 0.16) 0%, rgba(161, 242, 255, 0) 70%);
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
      }

      .product-card:hover {
        background: rgba(255, 255, 255, 0.06);
        border-color: var(--border);
        transform: translateY(-2px);
      }
      .product-card:hover::before { opacity: 1; }

      .product-card:focus-visible {
        outline: 1px solid var(--glow);
        outline-offset: 2px;
      }

      /* a touch more fill so cards hold up over blurred dashboard content */
      #overlay .product-card { background: rgba(255, 255, 255, 0.05); }
      #overlay .product-card:hover { background: rgba(255, 255, 255, 0.1); }

      .product-icon {
        width: 40px;
        height: 40px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: var(--primary-light);
        border: 1px solid rgba(4, 118, 126, 0.5);
        color: var(--glow);
        transition: background 0.25s, border-color 0.25s;
      }
      .product-card:hover .product-icon {
        background: rgba(4, 118, 126, 0.4);
        border-color: var(--primary);
      }
      .product-icon svg { display: block; }

      .product-title {
        display: block;
        font-size: 15px;
        font-weight: 400;
        letter-spacing: 0.01em;
      }

      .product-desc {
        display: block;
        margin-top: 6px;
        font-size: 12.5px;
        font-weight: 300;
        line-height: 1.5;
        color: var(--muted);
      }

      /* ===== DASHBOARD UNDERNEATH ===== */
      #detail.main { padding-top: 48px; }

      .detail-head {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .detail-head .product-icon {
        width: 46px;
        height: 46px;
        border-radius: 12px;
      }
      .detail-head .product-icon svg { width: 24px; height: 24px; }
      .detail-head h1 { margin: 0; }
      .detail-sub {
        margin-top: 3px;
        font-size: 12.5px;
        font-weight: 300;
        color: var(--muted);
      }

      /* Pipeline rail (adapted from dashboard.html timeline) */
      .tl-wrap { position: relative; margin-top: 8px; }
      .tl-track {
        position: absolute;
        top: 7px;
        transform: translateY(-50%);
        left: 0; right: 0;
        height: 2px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 2px;
      }
      .tl-fill {
        height: 100%;
        background: var(--primary);
        border-radius: 2px;
      }
      .tl-milestones {
        display: flex;
        justify-content: space-between;
        position: relative;
      }
      .tl-ms {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .tl-dot {
        width: 14px; height: 14px;
        border-radius: 50%;
        background: var(--bg);
        border: 2px solid rgba(255, 255, 255, 0.12);
        flex-shrink: 0;
        position: relative;
        z-index: 1;
      }
      .tl-ms.done .tl-dot {
        background: var(--primary);
        border-color: var(--primary);
      }
      .tl-ms.active .tl-dot {
        width: 16px; height: 16px;
        margin-top: -1px;
        background: var(--primary);
        border-color: #5ee0e8;
        box-shadow: 0 0 0 5px rgba(4, 118, 126, 0.25);
      }
      .tl-name {
        font-size: 11px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.35);
        white-space: nowrap;
        text-align: center;
      }
      .tl-ms.active .tl-name { color: var(--fg-text); font-weight: 600; }

      /* ===== RESPONSIVE ===== */
      @media (max-width: 900px) {
        .chart-grid, .chart-grid-bottom { grid-template-columns: 1fr; }
        .stat-grid { grid-template-columns: repeat(2, 1fr); }
        .tl-milestones { flex-wrap: wrap; gap: 20px 0; justify-content: flex-start; }
        .tl-ms { width: 33.33%; }
        .tl-track { display: none; }
      }
      @media (max-width: 520px) {
        .wrap { padding: 36px 20px 64px; }
        .product-grid { grid-template-columns: 1fr; }
        .stat-grid { grid-template-columns: 1fr; }
        .tl-ms { width: 50%; }
      }
    </style>

      const byKey = new Map(products.map(p => [p.key, p]));

      document.getElementById('grid').innerHTML = products.map(p => `
        <a class="product-card" href="#/${p.key}" data-key="${p.key}">
          <span class="product-icon"><svg ${ICON}>${p.icon}</svg></span>
          <span>
            <span class="product-title">${p.title}</span>
            <span class="product-desc">${p.desc}</span>
          </span>
        </a>
      `).join('');

      /* ===== SEEDED DATA HELPERS =====
         Same key always yields the same series, so a product's charts are
         stable across navigations but distinct from its neighbours. */
      function rng(seed) {
        let h = 1779033703 ^ seed.length;
        for (let i = 0; i < seed.length; i++) {
          h = Math.imul(h ^ seed.charCodeAt(i), 3432918353);
          h = (h << 13) | (h >>> 19);
        }
        return function () {
          h = Math.imul(h ^ (h >>> 16), 2246822507);
          h = Math.imul(h ^ (h >>> 13), 3266489909);
          h ^= h >>> 16;
          return (h >>> 0) / 4294967296;
        };
      }

      const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

      // Monotonic ramp from ~4% of total up to exactly `total`
      function cumulativeSeries(seed, total) {
        const r = rng(seed);
        const weights = MONTHS.map(() => 0.6 + r());
        const sum = weights.reduce((a, b) => a + b, 0);
        const start = Math.round(total * 0.04);
        let acc = start;
        const out = [];
        weights.forEach((w, i) => {
          acc = i === weights.length - 1 ? total : acc + Math.round((total - start) * w / sum);
          out.push(acc);
        });
        return out;
      }

      // Noisy but trending-up bars around `base`
      function barSeries(seed, base) {
        const r = rng(seed);
        return MONTHS.map((_, i) => {
          const trend = 1 + i * 0.035;
          return Math.max(1, Math.round(base * trend * (0.78 + r() * 0.44)));
        });
      }

      /* ===== DETAIL VIEW ===== */
      const PRIMARY     = '#04767E';
      const PRIMARY_DIM = 'rgba(4,118,126,0.35)';
      const GRID_COLOR  = 'rgba(255,255,255,0.06)';
      const TICK_COLOR  = 'rgba(255,255,255,0.35)';
      const RAMP = [PRIMARY, 'rgba(4,118,126,0.55)', 'rgba(4,118,126,0.3)', 'rgba(4,118,126,0.15)'];

      Chart.defaults.color = TICK_COLOR;
      Chart.defaults.borderColor = GRID_COLOR;
      Chart.defaults.font.family = 'system-ui, sans-serif';
      Chart.defaults.font.size = 11;

      let charts = [];
      const detail = document.getElementById('detail');

      function renderDetail(p) {
        const pct = p.stages.length > 1 ? (p.active / (p.stages.length - 1)) * 100 : 0;

        detail.innerHTML = `
          <button class="overlay-open-btn" id="open-overlay" type="button">

              <rect x="1" y="1" width="5" height="5" rx="1.2" stroke="currentColor" stroke-width="1.3"/>
              <rect x="8" y="1" width="5" height="5" rx="1.2" stroke="currentColor" stroke-width="1.3"/>
              <rect x="1" y="8" width="5" height="5" rx="1.2" stroke="currentColor" stroke-width="1.3"/>
              <rect x="8" y="8" width="5" height="5" rx="1.2" stroke="currentColor" stroke-width="1.3"/>

            All Products
          </button>

          <div class="topbar">
            <div class="detail-head">
              <span class="product-icon"><svg ${ICON}>${p.icon}</svg></span>
              <div>

            </div>

                <div class="stat-delta">${delta}</div>
              </div>
            `).join('')}
          </div>

          <div class="chart-grid">
            <div class="card">
              <div class="card-title">${p.line.title}</div>
              <div class="chart-wrap"><canvas id="lineChart"></canvas></div>
            </div>
            <div class="card">
              <div class="card-title">${p.donut.title}</div>
              <div class="chart-wrap"><canvas id="doughnutChart"></canvas></div>
            </div>
          </div>

          <div class="chart-grid-bottom">
            <div class="card">
              <div class="card-title">${p.bar.title}</div>
              <div class="chart-wrap"><canvas id="barChart"></canvas></div>
            </div>
            <div class="card">
              <div class="card-title">${p.table.title}</div>
              <div class="table-wrap">
                <table>
                  <thead><tr>${p.table.cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
                  <tbody>
                    ${p.table.rows.map(([what, where, status, kind, time]) => `
                      <tr>
                        <td>${what}</td>
                        <td>${where}</td>
                        <td><span class="status"><span class="dot ${kind === 'ok' ? '' : kind}"></span>${status}</span></td>
                        <td>${time}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;

        buildCharts(p);
      }

      function buildCharts(p) {
        charts.forEach(c => c.destroy());
        charts = [];

        charts.push(new Chart(document.getElementById('lineChart'), {
          type: 'line',
          data: {
            labels: MONTHS,
            datasets: [{
              label: p.line.label,
              data: cumulativeSeries(p.key + ':line', p.line.total),
              borderColor: PRIMARY,
              backgroundColor: 'rgba(4,118,126,0.12)',
              borderWidth: 2,
              pointRadius: 3,
              pointBackgroundColor: PRIMARY,
              fill: true,
              tension: 0.4
            }]
          },
          options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { color: GRID_COLOR } },
              y: { grid: { color: GRID_COLOR }, beginAtZero: true }
            }
          }
        }));

        charts.push(new Chart(document.getElementById('doughnutChart'), {
          type: 'doughnut',
          data: {
            labels: p.donut.labels,
            datasets: [{
              data: p.donut.data,
              backgroundColor: RAMP,
              borderColor: GRID_COLOR,
              borderWidth: 1
            }]
          },
          options: {
            responsive: true,
            cutout: '68%',
            plugins: {
              legend: { position: 'bottom', labels: { padding: 16, boxWidth: 10, boxHeight: 10 } }
            }
          }
        }));

        charts.push(new Chart(document.getElementById('barChart'), {
          type: 'bar',
          data: {
            labels: MONTHS,
            datasets: [{
              label: p.bar.label,
              data: barSeries(p.key + ':bar', p.bar.base),
              backgroundColor: PRIMARY_DIM,
              borderColor: PRIMARY,
              borderWidth: 1,
              borderRadius: 4
            }]
          },
          options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { display: false } },
              y: { grid: { color: GRID_COLOR }, beginAtZero: true }
            }
          }
        }));
      }

      /* ===== OVERLAY CONTROL =====
         The dashboard is always mounted underneath; the overlay just covers
         and blurs it. Picking a product swaps the dashboard and dismisses
         the overlay so the selection is revealed behind it. */
      const overlay = document.getElementById('overlay');

      function openOverlay() {
        document.body.classList.add('overlay-open');
        overlay.scrollTop = 0;
      }

      function closeOverlay() {
        document.body.classList.remove('overlay-open');
      }

      function selectProduct(p) {
        document.title = p.title + ' — Biorce Design';
        renderDetail(p);
        window.scrollTo(0, 0);
        closeOverlay();
      }

      document.getElementById('grid').addEventListener('click', e => {
        const card = e.target.closest('.product-card');
        if (!card) return;
        e.preventDefault();
        const p = byKey.get(card.dataset.key);
        if (p) selectProduct(p);
      });

      document.getElementById('close-overlay').addEventListener('click', closeOverlay);

      // delegated — the button is re-rendered with the dashboard each time
      detail.addEventListener('click', e => {
        if (e.target.closest('.overlay-open-btn')) openOverlay();
      });

      addEventListener('keydown', e => {
        if (e.key === 'Escape' && document.body.classList.contains('overlay-open')) closeOverlay();
      });

      // boot: dashboard rendered underneath, overlay up front
      renderDetail(products[0]);
      openOverlay();
    </script>
