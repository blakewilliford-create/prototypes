<style>
  :root {
    --cycle: 3200ms;
  }

  .stroke {
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: drawCycle var(--cycle) ease-in-out infinite;
  }

  .fill {
    opacity: 0;
    animation: fillCycle var(--cycle) ease-in-out infinite;
  }

  @keyframes drawCycle {
    0%,
    8% {
      stroke-dashoffset: 1;
    }
    55% {
      stroke-dashoffset: 0;
    }
    78% {
      stroke-dashoffset: 0;
    }
    100% {
      stroke-dashoffset: 1;
    }
  }

  @keyframes fillCycle {
    0%,
    55% {
      opacity: 0;
    }
    70% {
      opacity: 1;
    }
    78% {
      opacity: 1;
    }
    100% {
      opacity: 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .stroke {
      animation: none;
      stroke-dashoffset: 0;
    }
    .fill {
      animation: none;
      opacity: 1;
    }
  }
</style>
