    <rect width="1200" height="800" fill="#1C1E1E"/>

<style>
  @font-face { font-family:"Geist"; src:url("../ds/fonts/Geist-Regular.ttf") format("truetype"); font-weight:400; font-style:normal; font-display:swap; }
  @font-face { font-family:"Geist"; src:url("../ds/fonts/Geist-Medium.ttf")  format("truetype"); font-weight:500; font-style:normal; font-display:swap; }
  @font-face { font-family:"Geist"; src:url("../ds/fonts/Geist-Bold.ttf")    format("truetype"); font-weight:700; font-style:normal; font-display:swap; }

  :root{
    --brc-color-neutral-background:#1C1E1E;
    --brc-color-neutral-foreground:#F5F5F5;
    --brc-color-neutral-foregroundSubtle:#C4C6C6;
    --brc-color-turquoise-400:#5DF0F9;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    min-height:100vh;
    display:flex; flex-direction:column; gap:22px;
    align-items:center; justify-content:center;
    background:var(--brc-color-neutral-background);
    color:var(--brc-color-neutral-foreground);
    font-family:"Geist", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    text-align:center; padding:24px;
  }

  /* ── Animated boot emblem — each petal draws on (stroke-dashoffset) then fills ── */
  .fw-boot-emblem { width:104px; height:104px; overflow:visible; }
  .fw-petal {
    fill:url(#fwEmbGrad); fill-opacity:0;
    stroke:var(--brc-color-turquoise-400,#5DF0F9); stroke-width:1.1;
    stroke-linejoin:round; stroke-dasharray:1; stroke-dashoffset:1;
    animation:fw-petal-draw 2400ms cubic-bezier(.65,0,.35,1) infinite;
  }
  @keyframes fw-petal-draw {
    0%   { stroke-dashoffset:1; fill-opacity:0; }
    38%  { stroke-dashoffset:0; fill-opacity:0; }
    58%  { fill-opacity:1; }
    82%  { stroke-dashoffset:0; fill-opacity:1; stroke-opacity:1; }
    100% { stroke-dashoffset:0; fill-opacity:1; stroke-opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){ .fw-petal{ animation:none; fill-opacity:1; stroke-dashoffset:0; } }

  .fw-boot-title { font-size:17px; font-weight:600; letter-spacing:-.01em; }
  .fw-boot-sub { font-size:13px; color:var(--brc-color-neutral-foregroundSubtle); margin-top:-14px; }
</style>
</head>
