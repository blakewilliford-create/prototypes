<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wave Particles + Bloom + Orbit</title>
  <link rel="icon" type="image/png" href="favicons/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="favicons/favicon.svg" />
  <link rel="shortcut icon" href="favicons/favicon.ico" />

  <link rel="manifest" href="favicons/site.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }

</head>
<body class="page-canvas">
<a href="index.html" class="back-btn">
  <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">

  </svg>

</a>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/examples/jsm/postprocessing/UnrealBloomPass.js';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
import { createNoise3D } from 'https://cdn.jsdelivr.net/npm/simplex-noise@4.0.1/+esm';
import GUI from 'https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm';

// ----- SCENE -----
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x151a1d, 0.03);
scene.background = new THREE.Color(0x151a1d);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 10, 40);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const noise3D = createNoise3D();

// ----- ORBIT CONTROLS -----
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;     // smooth motion
controls.dampingFactor = 0.05;
controls.enablePan = false;        // optional: lock panning
controls.maxPolarAngle = Math.PI / 2; // prevent going below ground

// ----- BLOOM -----
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  0,
  0.4,
  0.85
);
composer.addPass(bloomPass);


// ----- PARTICLES -----
const gridSize = 150;
const spacing = 0.5;
const positions = [];

for (let x = -gridSize/2; x < gridSize/2; x++) {
  for (let z = -gridSize/2; z < gridSize/2; z++) {
    positions.push(x * spacing, 0, z * spacing);
  }
  
// }
// const count = 20000;
// const spread = 60;
// const positions = [];

// for (let i = 0; i < count; i++) {
//   const x = (Math.random() - 0.5) * spread;
//   const z = (Math.random() - 0.5) * spread;

//   positions.push(x, 0, z);
}

const geometry = new THREE.BufferGeometry();
const basePositions = new Float32Array(positions);
const jitterOffsets = new Float32Array(positions.length);
for (let i = 0; i < positions.length; i += 3) {
  jitterOffsets[i]     = (Math.random() - 0.5);
  jitterOffsets[i + 2] = (Math.random() - 0.5);
}
geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

const particleSize = { min: 0.01, max: 0.7 };

function generateSizes() {
  const count = geometry.attributes.position.count;
  const sizes = new Float32Array(count);
  for (let i = 0; i < count; i++)
    sizes[i] = particleSize.min + Math.random() * (particleSize.max - particleSize.min);
  return sizes;
}
geometry.setAttribute('size', new THREE.Float32BufferAttribute(generateSizes(), 1));

// glow texture
function createGlowTexture() {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.2, 'rgba(16,248,245,1)');
  g.addColorStop(0.4, 'rgba(16,248,245,0.4)');
  g.addColorStop(1, 'rgba(16,248,245,0)');

  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);

  return new THREE.CanvasTexture(canvas);
}

const material = new THREE.ShaderMaterial({
  uniforms: {
    map:           { value: createGlowTexture() },
    focalDistance: { value: 40.0 },
    focalRange:    { value: 20.0 },
    blurStrength:  { value: 1.0 },
    fadeDistance:  { value: 60.0 }
  },
  vertexShader: `
    attribute float size;
    uniform float focalDistance;
    uniform float focalRange;
    uniform float blurStrength;
    uniform float fadeDistance;
    varying float vBlur;
    varying float vFade;
    void main() {
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      float depth = -mvPosition.z;
      float blur = clamp(abs(depth - focalDistance) / focalRange, 0.0, 1.0);
      vBlur = blur;
      vFade = 1.0 - clamp(depth / fadeDistance, 0.0, 1.0);
      gl_PointSize = size * (400.0 / depth) * (1.0 + blur * blurStrength);
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    uniform sampler2D map;
    varying float vBlur;
    varying float vFade;
    void main() {
      vec4 c = texture2D(map, gl_PointCoord);
      c.a *= (1.0 - vBlur * 0.85) * vFade;
      gl_FragColor = c;
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

// ----- AGENT MATERIAL -----
const gu = { time: { value: 0 } };

const agentMaterial = new THREE.PointsMaterial({
  color: "#10F8F5",
  size: 1.0,
  sizeAttenuation: false,
  transparent: true,
  depthWrite: false,
  onBeforeCompile: shader => {
    shader.uniforms.time = gu.time;
    shader.vertexShader = `
    uniform float time;
    varying float vSinVal;
    ${shader.vertexShader.replace('uniform float size;', 'attribute float size;')}
    `.replace(
      `#include <begin_vertex>`,
      `#include <begin_vertex>
        vec3 wPos = vec3(modelMatrix * vec4(position, 1.));
      `
    ).replace(
      `gl_PointSize = size;`,
      `
      float t = time * 1.;
      wPos.y -= t;
      float sinVal = sin(mod(wPos.y * 3., PI2)) * 0.5 + 0.5;
      vSinVal = sinVal;
      float depth = -mvPosition.z;
      float sizeChange = 1. + sinVal * 3.;
      gl_PointSize = size * (400.0 / depth) * sizeChange;`
    );
    shader.fragmentShader = `
    varying float vSinVal;
    ${shader.fragmentShader}
    `.replace(
      `#include <clipping_planes_fragment>`,
      `#include <clipping_planes_fragment>
        float dist = length(gl_PointCoord.xy - 0.5);
        if (dist > 0.5) discard;
      `
    ).replace(
      `#include <alphatest_fragment>`,
      `#include <alphatest_fragment>
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.063, 0.973, 0.961), vSinVal);
        float f = smoothstep(0.5, 0.1, dist);
        diffuseColor.a = f;
      `
    );
  }
});

const points = new THREE.Points(geometry, material);
scene.add(points);

// ----- ANIMATION -----
const waveParams = { speed: 0.3, amplitude: 4 };
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();
  gu.time.value = t;
  const pos = geometry.attributes.position;

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);

    // const y =
    //   Math.sin(x * 0.25 + t) * 2 +
    //   Math.cos(z * 0.25 + t * 0.6) * 2;

    const y = noise3D(x * 0.05, z * 0.05, t * waveParams.speed) * waveParams.amplitude;

    pos.setY(i, y);
  }

  pos.needsUpdate = true;

  controls.update(); // REQUIRED for damping

  composer.render();
}
animate();

// ----- GUI -----
const gui = new GUI();

const materialToggle = { agentMaterial: false };
gui.add(materialToggle, 'agentMaterial').name('glow').onChange(v => {
  points.material = v ? agentMaterial : material;
});

const wavesFolder = gui.addFolder('Waves');
wavesFolder.add(waveParams, 'speed', 0, 2).onChange(v => waveParams.speed = v);
wavesFolder.add(waveParams, 'amplitude', 0, 20).onChange(v => waveParams.amplitude = v);
wavesFolder.open();

const noiserParams = { amount: 0.5 };
const applyJitter = () => {
  const pos = geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setX(i, basePositions[i * 3]     + jitterOffsets[i * 3]     * noiserParams.amount);
    pos.setZ(i, basePositions[i * 3 + 2] + jitterOffsets[i * 3 + 2] * noiserParams.amount);
  }
  pos.needsUpdate = true;
};
applyJitter();
const noiserFolder = gui.addFolder('Noiser');
noiserFolder.add(noiserParams, 'amount', 0, 5).name('jitter').onChange(applyJitter);
noiserFolder.open();

const sizeFolder = gui.addFolder('Particle Size');
const randomizeSize = () => {
  geometry.setAttribute('size', new THREE.Float32BufferAttribute(generateSizes(), 1));
};
sizeFolder.add(particleSize, 'min', 0.01, 2.0).onChange(randomizeSize);
sizeFolder.add(particleSize, 'max', 0.01, 2.0).onChange(randomizeSize);
sizeFolder.open();

const params = {
  strength: 0,
  radius: 0.4,
  threshold: 0.85
};

const bloomFolder = gui.addFolder('Bloom');
bloomFolder.add(params, 'strength', 0, 3).onChange(v => bloomPass.strength = v);
bloomFolder.add(params, 'radius', 0, 1).onChange(v => bloomPass.radius = v);
bloomFolder.add(params, 'threshold', 0, 1).onChange(v => bloomPass.threshold = v);
bloomFolder.open();

const dof = { focus: 40.0, range: 20.0, blur: 1.0, fade: 60.0 };

const cameraFolder = gui.addFolder('Camera');
cameraFolder.add(dof, 'focus', 1, 150).name('focal distance').onChange(v => material.uniforms.focalDistance.value = v);
cameraFolder.add(dof, 'range', 1, 100).name('focal range').onChange(v => material.uniforms.focalRange.value = v);
cameraFolder.add(dof, 'blur', 0, 10).name('blur strength').onChange(v => material.uniforms.blurStrength.value = v);
cameraFolder.add(dof, 'fade', 10, 200).name('fade distance').onChange(v => material.uniforms.fadeDistance.value = v);
cameraFolder.open();

// ----- RESIZE -----
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
