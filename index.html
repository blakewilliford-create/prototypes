<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biorce Design</title>
    <link rel="icon" type="image/png" href="favicons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicons/favicon.svg" />
    <link rel="shortcut icon" href="favicons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png" />
    <link rel="manifest" href="favicons/site.webmanifest" />
    <style>
      :root {
        --bg: #151a1d;
        --fg: #fefefe;
        --glow: #a1f2ff;
      }

      html, body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        overflow: hidden;
      }

      canvas {
        position: fixed;
        inset: 0;
        z-index: 0;
      }

      #ui {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 64px;
      }

      #logo {
        width: 180px;
        height: auto;
      }

      #wordmark {
        margin-top: 16px;
        color: var(--fg);
        font-family: system-ui, sans-serif;
        font-size: 18px;
        font-weight: 200;
        letter-spacing: 0.6em;
        text-transform: uppercase;
        opacity: 0.6;
      }

      #nav {
        margin-top: 40px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 220px;
      }

      #nav a {
        display: block;
        padding: 10px 24px;
        background: rgba(255, 255, 255, 0.05);
        -webkit-backdrop-filter: blur(50px);
        backdrop-filter: blur(50px);
        border-radius: 999px;
        color: var(--fg);
        font-family: system-ui, sans-serif;
        font-size: 13px;
        font-weight: 300;
        letter-spacing: 0.12em;
        text-decoration: none;
        text-align: center;
        transition: background 0.2s;
      }

      #nav a:hover {
        background: rgba(255, 255, 255, 0.1);
      }
    </style>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
    </script>
  </head>
  <body>
    <div id="ui">
      <img id="logo" src="SVGs/Logo.svg" alt="Logo" />
      <div id="wordmark">Design</div>
      <nav id="nav">
        <a href="loader.html">Loader</a>
        <a href="tile.html">Tiling</a>
        <a href="3D.html">3D</a>
        <a href="login.html">Login</a>
        <a href="dashboard.html">Dashboard</a>
      </nav>
    </div>

    <script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/examples/jsm/postprocessing/UnrealBloomPass.js';
import { createNoise3D } from 'https://cdn.jsdelivr.net/npm/simplex-noise@4.0.1/+esm';

// ----- SCENE -----
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x151a1d, 0.03);
scene.background = new THREE.Color(0x151a1d);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 10, 40);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const noise3D = createNoise3D();

// ----- BLOOM -----
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0, 0.4, 0.85);
composer.addPass(bloomPass);

// ----- PARTICLES -----
const gridSize = 150;
const spacing = 0.5;
const positions = [];

for (let x = -gridSize / 2; x < gridSize / 2; x++) {
  for (let z = -gridSize / 2; z < gridSize / 2; z++) {
    positions.push(x * spacing, 0, z * spacing);
  }
}

const geometry = new THREE.BufferGeometry();
const basePositions = new Float32Array(positions);
const jitterOffsets = new Float32Array(positions.length);
for (let i = 0; i < positions.length; i += 3) {
  jitterOffsets[i]     = (Math.random() - 0.5);
  jitterOffsets[i + 2] = (Math.random() - 0.5);
}
geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

const particleSize = { min: 0.01, max: 0.7 };
function generateSizes() {
  const count = geometry.attributes.position.count;
  const sizes = new Float32Array(count);
  for (let i = 0; i < count; i++)
    sizes[i] = particleSize.min + Math.random() * (particleSize.max - particleSize.min);
  return sizes;
}
geometry.setAttribute('size', new THREE.Float32BufferAttribute(generateSizes(), 1));

// apply default jitter
const pos0 = geometry.attributes.position;
for (let i = 0; i < pos0.count; i++) {
  pos0.setX(i, basePositions[i * 3]     + jitterOffsets[i * 3]     * 0.5);
  pos0.setZ(i, basePositions[i * 3 + 2] + jitterOffsets[i * 3 + 2] * 0.5);
}
pos0.needsUpdate = true;

function createGlowTexture() {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0,   'rgba(255,255,255,1)');
  g.addColorStop(0.2, 'rgba(0,255,255,1)');
  g.addColorStop(0.4, 'rgba(0,255,255,0.4)');
  g.addColorStop(1,   'rgba(0,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(canvas);
}

const material = new THREE.ShaderMaterial({
  uniforms: {
    map:           { value: createGlowTexture() },
    focalDistance: { value: 40.0 },
    focalRange:    { value: 20.0 },
    blurStrength:  { value: 1.0 },
    fadeDistance:  { value: 60.0 }
  },
  vertexShader: `
    attribute float size;
    uniform float focalDistance;
    uniform float focalRange;
    uniform float blurStrength;
    uniform float fadeDistance;
    varying float vBlur;
    varying float vFade;
    void main() {
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      float depth = -mvPosition.z;
      float blur = clamp(abs(depth - focalDistance) / focalRange, 0.0, 1.0);
      vBlur = blur;
      vFade = 1.0 - clamp(depth / fadeDistance, 0.0, 1.0);
      gl_PointSize = size * (400.0 / depth) * (1.0 + blur * blurStrength);
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    uniform sampler2D map;
    varying float vBlur;
    varying float vFade;
    void main() {
      vec4 c = texture2D(map, gl_PointCoord);
      c.a *= (1.0 - vBlur * 0.85) * vFade;
      gl_FragColor = c;
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

scene.add(new THREE.Points(geometry, material));

// ----- ANIMATION -----
const waveParams = { speed: 0.3, amplitude: 4 };
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const pos = geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setY(i, noise3D(pos.getX(i) * 0.05, pos.getZ(i) * 0.05, t * waveParams.speed) * waveParams.amplitude);
  }
  pos.needsUpdate = true;
  composer.render();
}
animate();

// ----- RESIZE -----
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
    </script>
  </body>
</html>
