<head>

  <title>Wave Particles + Bloom + Orbit</title>

      justify-content: center;

    #login-card {
      pointer-events: all;

      backdrop-filter: blur(50px);
      border: 0px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 48px 40px 40px;
      width: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    #login-card img {
      width: 160px;
      height: auto;
    }

    #login-fields {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;

    }

    #login-fields button:hover {

    }

    .back-btn {

      top: 20px;

      font-size: 13px;

      letter-spacing: 0.12em;

<div id="login-overlay">
  <div id="login-card">
    <img src="SVGs/Logo.svg" alt="Logo" />
    <div id="login-fields">
      <input type="text" placeholder="Username" autocomplete="username" />
      <input type="password" placeholder="Password" autocomplete="current-password" />

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/examples/jsm/postprocessing/UnrealBloomPass.js';
// import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
import { createNoise3D } from 'https://cdn.jsdelivr.net/npm/simplex-noise@4.0.1/+esm';

// ----- SCENE -----
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x151a1d, 0.03);
scene.background = new THREE.Color(0x151a1d);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 17, 38);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const noise3D = createNoise3D();

// ----- ORBIT CONTROLS -----
// const controls = new OrbitControls(camera, renderer.domElement);
// controls.enableDamping = true;
// controls.dampingFactor = 0.05;
// controls.enablePan = false;
// controls.maxPolarAngle = Math.PI / 2;

// ----- BLOOM -----
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  0,
  0.4,
  0.85
);
composer.addPass(bloomPass);


// ----- PARTICLES -----
const gridSize = 150;
const spacing = 0.5;
const positions = [];

for (let x = -gridSize/2; x < gridSize/2; x++) {
  for (let z = -gridSize/2; z < gridSize/2; z++) {
    positions.push(x * spacing, 0, z * spacing);
  }

// }
// const count = 20000;
// const spread = 60;
// const positions = [];

// for (let i = 0; i < count; i++) {
//   const x = (Math.random() - 0.5) * spread;
//   const z = (Math.random() - 0.5) * spread;

//   positions.push(x, 0, z);
}

const geometry = new THREE.BufferGeometry();
const basePositions = new Float32Array(positions);
const jitterOffsets = new Float32Array(positions.length);
for (let i = 0; i < positions.length; i += 3) {
  jitterOffsets[i]     = (Math.random() - 0.5);
  jitterOffsets[i + 2] = (Math.random() - 0.5);
}
geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

const particleSize = { min: 0.01, max: 0.7 };

function generateSizes() {
  const count = geometry.attributes.position.count;
  const sizes = new Float32Array(count);
  for (let i = 0; i < count; i++)
    sizes[i] = particleSize.min + Math.random() * (particleSize.max - particleSize.min);
  return sizes;
}
geometry.setAttribute('size', new THREE.Float32BufferAttribute(generateSizes(), 1));

// glow texture
function createGlowTexture() {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.2, 'rgba(0,255,255,1)');
  g.addColorStop(0.4, 'rgba(0,255,255,0.4)');
  g.addColorStop(1, 'rgba(0,255,255,0)');

  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);

  return new THREE.CanvasTexture(canvas);
}

const material = new THREE.ShaderMaterial({
  uniforms: {
    map:           { value: createGlowTexture() },
    focalDistance: { value: 40.0 },
    focalRange:    { value: 20.0 },
    blurStrength:  { value: 1.0 },
    fadeDistance:  { value: 60.0 }
  },
  vertexShader: `
    attribute float size;
    uniform float focalDistance;
    uniform float focalRange;
    uniform float blurStrength;
    uniform float fadeDistance;
    varying float vBlur;
    varying float vFade;
    void main() {
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      float depth = -mvPosition.z;
      float blur = clamp(abs(depth - focalDistance) / focalRange, 0.0, 1.0);
      vBlur = blur;
      vFade = 1.0 - clamp(depth / fadeDistance, 0.0, 1.0);
      gl_PointSize = size * (400.0 / depth) * (1.0 + blur * blurStrength);
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    uniform sampler2D map;
    varying float vBlur;
    varying float vFade;
    void main() {
      vec4 c = texture2D(map, gl_PointCoord);
      c.a *= (1.0 - vBlur * 0.85) * vFade;
      gl_FragColor = c;
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const points = new THREE.Points(geometry, material);
scene.add(points);

// ----- ANIMATION -----
const waveParams = { speed: 0.3, amplitude: 4 };
const clock = new THREE.Clock();

// apply default jitter
const noiserParams = { amount: 0.5 };
const pos0 = geometry.attributes.position;
for (let i = 0; i < pos0.count; i++) {
  pos0.setX(i, basePositions[i * 3]     + jitterOffsets[i * 3]     * noiserParams.amount);
  pos0.setZ(i, basePositions[i * 3 + 2] + jitterOffsets[i * 3 + 2] * noiserParams.amount);
}
pos0.needsUpdate = true;

function animate() {
  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();
  const pos = geometry.attributes.position;

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);

    const y = noise3D(x * 0.05, z * 0.05, t * waveParams.speed) * waveParams.amplitude;

    pos.setY(i, y);
  }

  pos.needsUpdate = true;

  // controls.update();

  composer.render();
}
animate();

// ----- GUI (commented out for login page) -----

// sizeFolder.add(particleSize, 'max', 0.01, 2.0).onChange(...);
// const bloomFolder = gui.addFolder('Bloom');
// bloomFolder.add(params, 'strength', 0, 3).onChange(v => bloomPass.strength = v);
// const cameraFolder = gui.addFolder('Camera');
// cameraFolder.add(dof, 'focus', 1, 150).name('focal distance')...

// ----- RESIZE -----
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
